<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tarjeta 1 - Ruby & Gold Romance</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Great+Vibes&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 900px;
      height: 1350px;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .card-standalone-root {
      width: 900px;
      height: 1350px;
      position: relative;
      border-radius: 36px;
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.95), 0 0 40px rgba(212, 175, 55, 0.3);
    }

    .card-gold-corners {
      position: absolute;
      inset: 22px;
      pointer-events: none;
    }
    .card-gold-corners::before, .card-gold-corners::after,
    .corner-bottom-left, .corner-bottom-right {
      content: "";
      position: absolute;
      width: 50px;
      height: 50px;
      border: 2px solid #ffd700;
    }
    .card-gold-corners::before { top: 0; left: 0; border-right: none; border-bottom: none; }
    .card-gold-corners::after { top: 0; right: 0; border-left: none; border-bottom: none; }
    .corner-bottom-left { bottom: 0; left: 0; border-right: none; border-top: none; }
    .corner-bottom-right { bottom: 0; right: 0; border-left: none; border-top: none; }

    .card-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 30px;
      background: rgba(58, 6, 26, 0.9);
      border: 1.8px solid #ffd700;
      border-radius: 999px;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4), inset 0 0 12px rgba(255, 215, 0, 0.25);
    }
    .card-badge-pill span {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 700;
      color: #fff9e6;
      letter-spacing: 0.16em;
    }

    .card-header-block {
      text-align: center;
      margin-top: 10px;
    }
    .card-script-eyebrow {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      color: #f5d77f;
      line-height: 1;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }
    .card-names-title {
      font-family: 'Cinzel', serif;
      font-size: 3.4rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      background: linear-gradient(180deg, #ffffff 0%, #fff4cc 30%, #ffd700 70%, #d4af37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 20px rgba(255, 215, 0, 0.7));
      margin: 4px 0 10px 0;
    }

    .card-intertwined-hearts {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 4px;
    }
    .card-divider-line {
      width: 100px;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, #ffd700, transparent);
    }

    /* QR Code Display Container */
    .qr-frame-wrapper {
      position: relative;
      padding: 16px;
      background: linear-gradient(135deg, #fff2cc 0%, #ffd700 50%, #b8860b 100%);
      border-radius: 28px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.9), 0 0 35px rgba(255, 215, 0, 0.65);
      margin: 15px 0;
    }
    .qr-frame-inner {
      background: #ffffff;
      padding: 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .qr-image {
      width: 380px;
      height: 380px;
      display: block;
      border-radius: 12px;
    }
    .qr-center-heart {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 64px;
      height: 64px;
      background: radial-gradient(circle at 35% 35%, #ff4d6d, #b5173f 60%, #500718 100%);
      border: 3px solid #ffd700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7), 0 0 15px rgba(255, 215, 0, 0.8);
      font-size: 1.8rem;
      color: #ffffff;
    }

    .card-instructions {
      text-align: center;
      max-width: 680px;
    }
    .card-instructions .inst-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.55rem;
      font-weight: 600;
      color: #fff8e7;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }
    .card-instructions .inst-quote {
      font-family: 'Great Vibes', cursive;
      font-size: 2.1rem;
      color: #ffd700;
      line-height: 1.2;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.7);
      margin-bottom: 6px;
    }
    .card-instructions .inst-hint {
      font-size: 1.05rem;
      color: #ffb3c6;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 500;
    }

    .card-footer-signoff {
      width: 100%;
      border-top: 1px solid rgba(212, 175, 55, 0.35);
      padding-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e5b366;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
    }
    .card-footer-signoff .footer-sig {
      font-family: 'Great Vibes', cursive;
      font-size: 2.2rem;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
    }

    
    .card-ruby-gold {
      background: radial-gradient(circle at 50% 12%, #4a0828 0%, #200411 50%, #0a0106 100%);
      border: 4px solid #d4af37;
      outline: 1.5px solid rgba(255, 215, 0, 0.4);
      outline-offset: -16px;
    }
  
  </style>
</head>
